name: CI

on: [push]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      
    steps:
      - uses: actions/checkout@v4
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/craztool/practice-app:latest
            ghcr.io/craztool/practice-app:${{ github.sha }}
            
      - name: Update deployment.yaml with new image hash
        run: |
          sed -i -E "s|image: ghcr.io/craztool/practice-app:.*|image: ghcr.io/craztool/practice-app:${{ github.sha }}|g" k8s/deployment.yaml
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add k8s/deployment.yaml
          git commit -m "GitOps: update image tag to ${{ github.sha }}"
          git push